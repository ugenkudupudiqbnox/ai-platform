# =============================================================================
# Redis configuration — Enterprise AI Platform
# Password and maxmemory are supplied on the command line (see docker-compose.yml)
# so that no secret is ever written to this read-only mounted file.
# =============================================================================

# --- Network -----------------------------------------------------------------
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0

# --- General -----------------------------------------------------------------
daemonize no
loglevel notice
databases 16
# Log to stdout so Docker captures it (json-file driver with rotation).
logfile ""

# --- Persistence: AOF (primary) ---------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# Balance durability and throughput: fsync once per second.
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
aof-timestamp-enabled no

# --- Persistence: RDB snapshots (secondary safety net) ----------------------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# --- Memory management -------------------------------------------------------
# maxmemory is injected via --maxmemory on the command line.
maxmemory-policy allkeys-lru
maxmemory-samples 5

# --- Lazy freeing (avoid blocking the main thread) --------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes

# --- Clients -----------------------------------------------------------------
maxclients 10000

# --- Slow log ----------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Security hardening: disable/redact dangerous commands ------------------
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG "CONFIG_b8f1e2"
