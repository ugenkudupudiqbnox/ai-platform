[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfx-ar-common"
version = "0.1.0"
description = "AR Common -- a Langflow Extension bundling the Cosmic AR Agent's shared components (supervisor, envelope, approval, idempotency, checkpoint, audit) and the typed AgentState."
requires-python = ">=3.10"
# Inline bundles rely on packages already present in the langflow image venv
# (langgraph, langchain, sqlalchemy, lfx). Mirrors the ap_tools precedent.
dependencies = []

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["components*"]

[tool.setuptools.package-data]
"*" = ["extension.json"]

[tool.langflow.extension]
manifest = "extension.json"

[project.entry-points."langflow.extensions"]
ar_common = "components.ar_common"