# =============================================================================
# NGINX — Enterprise AI Platform reverse proxy (main config)
# Per-service virtual hosts live in conf.d/ and are included explicitly below
# (no wildcard) so that snippet files (ssl.conf, security-headers.conf,
# acme.conf, proxy.conf) are only pulled in where referenced.
# =============================================================================
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Structured (JSON) access logging ------------------------------------
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$host",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
      '}';
    access_log /var/log/nginx/access.log json_combined;

    # --- Core tuning ---------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;
    server_names_hash_bucket_size 128;

    # Large uploads (chat attachments, flow imports).
    client_max_body_size 200m;
    client_body_buffer_size 1m;
    large_client_header_buffers 4 16k;

    # --- Proxy buffers -------------------------------------------------------
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml application/wasm;

    # --- WebSocket upgrade map -----------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS resolver (for proxy_pass to service names).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --- Rate limiting zones, upstreams and virtual hosts --------------------
    include /etc/nginx/conf.d/ratelimit.conf;
    include /etc/nginx/conf.d/upstreams.conf;
    include /etc/nginx/conf.d/default.conf;
    include /etc/nginx/conf.d/chat.conf;
    include /etc/nginx/conf.d/auth.conf;
    include /etc/nginx/conf.d/flow.conf;
    include /etc/nginx/conf.d/trace.conf;
    include /etc/nginx/conf.d/metrics.conf;
}
