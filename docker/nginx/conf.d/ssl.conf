# Shared TLS configuration (included inside each HTTPS server block).
# A single certificate (cert-name "aiplatform") covers all four subdomains as
# SANs. install.sh creates a self-signed bootstrap cert at this path first, then
# Certbot replaces it with a Let's Encrypt certificate.
ssl_certificate     /etc/letsencrypt/live/aiplatform/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/aiplatform/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# OCSP stapling (effective once a CA-issued cert with a chain is in place).
ssl_stapling on;
ssl_stapling_verify on;
