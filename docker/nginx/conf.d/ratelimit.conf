# Rate limiting zones (http context). Applied per-location in the vhosts.
# Keyed on the real client IP forwarded by the load balancer / direct connection.

# General browsing traffic.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# Authentication endpoints (login, token) — stricter.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

# API / ingestion endpoints (tracing, chat completions) — higher burst.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# Cap concurrent connections per client.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Return 429 (not the default 503) when throttled.
limit_req_status 429;
limit_conn_status 429;
