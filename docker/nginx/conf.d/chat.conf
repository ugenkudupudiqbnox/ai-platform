# chat.<domain> -> LibreChat
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^chat\.;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    # Chat attachments and imports can be large.
    client_max_body_size 200m;

    limit_conn conn_per_ip 50;

    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://librechat_upstream;
    }

    # Streaming completions / websockets.
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_buffering off;
        # Custom endpoints (e.g. the LangFlow adapter) can run a flow for the
        # full LANGFLOW_WORKER_TIMEOUT (300s) before the first byte is emitted,
        # and the OpenAI SDK waits up to 10min upstream. The nginx default of 60s
        # would 504 a long/looping flow run at the edge. Match flow.conf's 600s
        # headroom. Raise both if LANGFLOW_WORKER_TIMEOUT is pushed past 600s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://librechat_upstream;
    }
}
