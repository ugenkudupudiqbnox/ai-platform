# Port-80 default server: health probe, ACME challenges, HTTPS redirect.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Container healthcheck endpoint (no redirect).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/conf.d/acme.conf;

    # Everything else is redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# Catch-all HTTPS server: rejects requests for unknown hostnames.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/conf.d/ssl.conf;

    return 444;
}
