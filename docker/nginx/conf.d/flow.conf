# flow.<domain> -> oauth2-proxy -> LangFlow
# oauth2-proxy enforces Keycloak authentication and proxies to LangFlow upstream,
# so NGINX simply forwards all traffic to oauth2-proxy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^flow\.;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    # Flow imports / file components can be large.
    client_max_body_size 200m;
    limit_conn conn_per_ip 50;

    # Content-hashed static frontend assets (JS/CSS bundles). Filenames change
    # on every rebuild, so they're safe to cache immutably for a year — repeat
    # visits serve the (large) bundle from the browser disk cache with zero
    # server round-trips. Buffering ON lets nginx gzip the bundle. Still authed
    # via oauth2-proxy; security-headers.conf is re-included because a child
    # location with its own add_header otherwise drops the server-level ones.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        proxy_pass http://oauth2_proxy_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.conf;
        # LangFlow streams build logs over websockets through oauth2-proxy.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://oauth2_proxy_upstream;
    }
}
