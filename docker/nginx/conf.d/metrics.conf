# Internal stub_status endpoint scraped by nginx-prometheus-exporter.
# Listens on a separate port reachable only on the Docker edge network.
server {
    listen 8081;
    server_name _;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 172.16.0.0/12;   # Docker bridge networks
        allow 127.0.0.1;
        deny all;
    }
}
