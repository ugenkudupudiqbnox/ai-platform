# Security response headers (included inside each HTTPS server block).
# `always` ensures headers are sent even on error responses.

# Force HTTPS for two years, including subdomains, and allow preload listing.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Hide upstream identifying headers.
proxy_hide_header X-Powered-By;
