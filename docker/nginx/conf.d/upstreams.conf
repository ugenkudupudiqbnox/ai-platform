# Upstream service definitions (Docker service names on the edge network).
upstream librechat_upstream {
    server librechat:3080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream keycloak_upstream {
    server keycloak:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream oauth2_proxy_upstream {
    server oauth2-proxy:4180 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream langfuse_upstream {
    server langfuse-web:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}
