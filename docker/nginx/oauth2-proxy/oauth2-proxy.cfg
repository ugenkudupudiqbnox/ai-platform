# =============================================================================
# oauth2-proxy — Keycloak gate in front of LangFlow.
# Host-specific values (issuer URL, redirect URL, cookie domain) and all secrets
# are supplied via environment variables in docker-compose.yml so this file
# carries no secrets and no domain assumptions.
# =============================================================================

http_address = "0.0.0.0:4180"

# Act as a reverse proxy in front of the upstream application.
reverse_proxy = true
upstreams = ["http://langflow:7860"]

# OIDC provider (Keycloak).
provider = "oidc"
provider_display_name = "Keycloak"
scope = "openid profile email"

# Authorize any authenticated Keycloak user (tighten with allowed_groups if needed).
email_domains = ["*"]

# Show the Keycloak login button rather than auto-redirecting.
skip_provider_button = false

# Forward identity to the upstream.
pass_access_token = true
pass_authorization_header = true
set_authorization_header = true
set_xauthrequest = true
pass_user_headers = true

# Cookie / session hardening.
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_refresh = "1h"

# Health/ready endpoints.
ping_path = "/ping"
ready_path = "/ready"
