# =============================================================================
# Enterprise AI Platform — Docker Compose
# -----------------------------------------------------------------------------
# Services:
#   edge      : nginx, oauth2-proxy, certbot (tools profile)
#   apps      : librechat, keycloak, langflow (web), langflow-worker, flower,
#               langfuse-web, langfuse-worker
#   data      : postgres, redis, mongo, clickhouse, minio (+ minio-init)
#   monitoring: profile "monitoring" (see monitoring/docker-compose.monitoring.yml)
#
# All secrets come from `.env` (generated by install.sh). No defaults are baked in.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

x-security: &hardening
  security_opt:
    - no-new-privileges:true

networks:
  edge:
    name: aiplatform-edge
  backend:
    name: aiplatform-backend

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  keycloak_data:
  langflow_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  librechat_images:
  librechat_uploads:
  librechat_logs:
  certbot_conf:
  certbot_www:

services:

  # ---------------------------------------------------------------------------
  # Data tier
  # ---------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_SUPER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by the init script to provision least-privilege databases.
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      LANGFLOW_DB_NAME: ${LANGFLOW_DB_NAME}
      LANGFLOW_DB_USER: ${LANGFLOW_DB_USER}
      LANGFLOW_DB_PASSWORD: ${LANGFLOW_DB_PASSWORD}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: ${MONGO_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: ${MINIO_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [backend]

  # One-shot: create the Langfuse bucket, then exit. Uses the MinIO client image
  # (the server image does not ship `mc`). The retry loop also serves as the
  # readiness gate for MinIO.
  minio-init:
    image: ${MINIO_MC_IMAGE}
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing "local/$${LANGFUSE_S3_BUCKET}"
        mc anonymous set none "local/$${LANGFUSE_S3_BUCKET}" || true
        echo "minio bucket ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_BUCKET: ${LANGFUSE_S3_BUCKET}
    networks: [backend]
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------
  keycloak:
    build:
      context: ./docker/keycloak
      args:
        KEYCLOAK_IMAGE: ${KEYCLOAK_IMAGE}
    image: aiplatform/keycloak:local
    <<: [*default-restart, *hardening]
    logging: *default-logging
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_CONSOLE_OUTPUT: json
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak_data:/opt/keycloak/data
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q 'UP'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------------------------------
  # LangFlow (web tier: gunicorn + uvicorn workers)
  # ---------------------------------------------------------------------------
  langflow:
    build:
      context: ./docker/langflow
      args:
        LANGFLOW_IMAGE: ${LANGFLOW_IMAGE}
    image: aiplatform/langflow:local
    <<: [*default-restart, *hardening]
    logging: *default-logging
    command: ["web"]
    environment:
      LANGFLOW_DATABASE_URL: postgresql://${LANGFLOW_DB_USER}:${LANGFLOW_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${LANGFLOW_DB_NAME}
      LANGFLOW_CONFIG_DIR: /var/lib/langflow
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY}
      LANGFLOW_WORKERS: ${LANGFLOW_WORKERS}
      LANGFLOW_WORKER_TIMEOUT: ${LANGFLOW_WORKER_TIMEOUT}
      LANGFLOW_PRELOAD: ${LANGFLOW_PRELOAD}
      LANGFLOW_LOG_LEVEL: ${LANGFLOW_LOG_LEVEL}
      LANGFLOW_PROMETHEUS_ENABLED: "true"
      LANGFLOW_PROMETHEUS_PORT: "9090"
      LANGFLOW_CACHE_TYPE: redis
      LANGFLOW_REDIS_HOST: ${REDIS_HOST}
      LANGFLOW_REDIS_PORT: ${REDIS_PORT}
      LANGFLOW_REDIS_DB: ${REDIS_DB_LANGFLOW_BACKEND}
      LANGFLOW_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Celery task queue (Redis broker + result backend)
      CELERY_BROKER_URL: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BROKER}
      CELERY_RESULT_BACKEND: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BACKEND}
      BROKER_URL: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BROKER}
      RESULT_BACKEND: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BACKEND}
      # LangFlow -> Langfuse tracing (auto-wired)
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      DO_NOT_TRACK: "true"
    volumes:
      - langflow_data:/var/lib/langflow
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/health').status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # LangFlow Celery worker tier — scale with `--scale langflow-worker=N`
  # or via LANGFLOW_WORKER_REPLICAS (deploy.replicas).
  langflow-worker:
    image: aiplatform/langflow:local
    <<: [*default-restart, *hardening]
    logging: *default-logging
    command: ["worker"]
    environment:
      LANGFLOW_DATABASE_URL: postgresql://${LANGFLOW_DB_USER}:${LANGFLOW_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${LANGFLOW_DB_NAME}
      LANGFLOW_CONFIG_DIR: /var/lib/langflow
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY}
      LANGFLOW_LOG_LEVEL: ${LANGFLOW_LOG_LEVEL}
      LANGFLOW_CACHE_TYPE: redis
      LANGFLOW_REDIS_HOST: ${REDIS_HOST}
      LANGFLOW_REDIS_PORT: ${REDIS_PORT}
      LANGFLOW_REDIS_DB: ${REDIS_DB_LANGFLOW_BACKEND}
      LANGFLOW_REDIS_PASSWORD: ${REDIS_PASSWORD}
      LANGFLOW_WORKER_CONCURRENCY: ${LANGFLOW_WORKER_CONCURRENCY}
      LANGFLOW_WORKER_AUTOSCALE: ${LANGFLOW_WORKER_AUTOSCALE}
      CELERY_BROKER_URL: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BROKER}
      CELERY_RESULT_BACKEND: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BACKEND}
      BROKER_URL: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BROKER}
      RESULT_BACKEND: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BACKEND}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      DO_NOT_TRACK: "true"
    volumes:
      - langflow_data:/var/lib/langflow
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      langflow:
        condition: service_healthy
    deploy:
      replicas: ${LANGFLOW_WORKER_REPLICAS}
    stop_grace_period: 60s

  # Celery queue dashboard
  flower:
    image: ${FLOWER_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    command:
      - celery
      - --broker=redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFLOW_BROKER}
      - flower
      - --port=5555
      - --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    networks: [backend, edge]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5555/healthcheck').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Langfuse (v3: Postgres + ClickHouse + Redis + MinIO)
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: ${LANGFUSE_WEB_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${LANGFUSE_DB_NAME}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFUSE}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: https://${TRACE_HOST}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      AUTH_KEYCLOAK_CLIENT_ID: ${LANGFUSE_AUTH_KEYCLOAK_CLIENT_ID}
      AUTH_KEYCLOAK_CLIENT_SECRET: ${LANGFUSE_AUTH_KEYCLOAK_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: https://${AUTH_HOST}/realms/${KEYCLOAK_REALM}
      AUTH_KEYCLOAK_ALLOW_ACCOUNT_LINKING: "true"
      AUTH_DISABLE_USERNAME_PASSWORD: ${LANGFUSE_AUTH_DISABLE_PASSWORD_LOGIN}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:3000/api/public/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${LANGFUSE_DB_NAME}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LANGFUSE}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:3030/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # LibreChat (chat UI)
  # ---------------------------------------------------------------------------
  librechat:
    image: ${LIBRECHAT_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    environment:
      HOST: "0.0.0.0"
      PORT: "3080"
      CHAT_HOST: ${CHAT_HOST}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_INSTANCE_NAME: ${AZURE_OPENAI_INSTANCE_NAME}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB_NAME}?authSource=admin
      DOMAIN_CLIENT: https://${CHAT_HOST}
      DOMAIN_SERVER: https://${CHAT_HOST}
      CONFIG_PATH: /app/librechat.yaml
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION}
      ALLOW_EMAIL_LOGIN: ${LIBRECHAT_ALLOW_EMAIL_LOGIN}
      ALLOW_SOCIAL_LOGIN: ${LIBRECHAT_ALLOW_SOCIAL_LOGIN}
      SEARCH: "false"
      USE_REDIS: "true"
      REDIS_URI: redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_LIBRECHAT}
      # OIDC (Keycloak)
      OPENID_ISSUER: https://${AUTH_HOST}/realms/${KEYCLOAK_REALM}
      OPENID_CLIENT_ID: ${OPENID_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET}
      OPENID_SESSION_SECRET: ${OPENID_SESSION_SECRET}
      OPENID_SCOPE: ${OPENID_SCOPE}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_BUTTON_LABEL: ${OPENID_BUTTON_LABEL}
      OPENID_AUTO_REDIRECT: ${OPENID_AUTO_REDIRECT}
      # Provider keys (blank disables)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_KEY: ${GOOGLE_API_KEY}
      AZURE_API_KEY: ${AZURE_OPENAI_API_KEY}
    volumes:
      - ./docker/librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/api/logs
    networks: [backend, edge]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:3080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------
  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${AUTH_HOST}/realms/${KEYCLOAK_REALM}
      OAUTH2_PROXY_REDIRECT_URL: https://${FLOW_HOST}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: .${BASE_DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${BASE_DOMAIN}
    volumes:
      - ./docker/nginx/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    networks: [backend, edge]
    depends_on:
      keycloak:
        condition: service_healthy
      langflow:
        condition: service_healthy
    # NOTE: the oauth2-proxy image is distroless (no shell/wget), so no container
    # healthcheck is defined; readiness is gated by its dependencies above.

  nginx:
    image: ${NGINX_IMAGE}
    <<: [*default-restart, *hardening]
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (QUIC) — requires a QUIC-enabled nginx build (see docs/troubleshooting.md)
      # - "443:443/udp"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    networks: [edge]
    depends_on:
      librechat:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      oauth2-proxy:
        condition: service_started
      langfuse-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Certbot — not started by `up`; invoked on demand:
  #   docker compose run --rm certbot certonly ...
  certbot:
    image: ${CERTBOT_IMAGE}
    profiles: ["tools"]
    logging: *default-logging
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [edge]
